version: "3.9"

services:
  backend:
    build: .
    container_name: biomed-backend
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
  frontend:
    build: .
    container_name: biomed-frontend
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
